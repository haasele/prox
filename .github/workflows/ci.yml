name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Docker version
        run: docker version
      - name: End-to-end acceptance suite
        run: make e2e

  docker-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Routes survive a dockerd restart
        env:
          PROX_E2E_DOCKER_RESTART: "1"
        run: go test -tags=e2e -count=1 -v ./test/e2e -run '^TestDockerRestart$'

  authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - name: Enforcement via Docker AuthZ plugin
        run: sudo env "PATH=$PATH" bash test/e2e/authz-ci.sh

  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - name: Install as root on 80/443 and run gw doctor
        run: sudo env "PATH=$PATH" bash test/e2e/doctor-ci.sh

  installer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:stable-slim
          - fedora:latest
          - archlinux:latest
          - alpine:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - name: Install and uninstall in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" sh -c '
            if command -v apk >/dev/null 2>&1; then apk add --no-cache bash >/dev/null; fi
            bash ./install.sh --prefix /opt/prox --binary /src/bin/prox --no-service --no-ca --no-docker-host
            /opt/prox/bin/gw version
            bash ./install.sh --prefix /opt/prox --binary /src/bin/prox --no-service --no-ca --no-docker-host --uninstall
            test ! -e /opt/prox/bin/prox
          '

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build packages and completions
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: prox-packages
          path: dist/
          if-no-files-found: error
